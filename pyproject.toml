[project]
name = "funpay-mcp"
version = "1.0.0"
description = "MCP сервер для ВСЕХ действий на FunPay: анализ рынка, объявления, чат, заказы, профиль, отзывы"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "fake-useragent>=1.5.0",
    "playwright>=1.60.0",
]

[project.scripts]
funpay-mcp = "funpay_mcp.server:main"

[project.urls]
Documentation = "https://github.com/makssest06-alt/funpay-mcp"
